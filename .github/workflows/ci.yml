name: ci

on:
    push:
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build:
        runs-on: ${{ matrix.os }}
        name: "python ${{ matrix.python-version }} on ${{ matrix.backend }}"
        strategy:
            fail-fast: true
            matrix:
                # If you change one of these, be sure to update:
                # - /pyproject.toml:[tool.mypy]
                # If adding new python versions, consider also updating
                # python version in .readthedocs.yaml
                # TODO: Add back pypy here and in release.yml once:
                # https://github.com/pypy/pypy/issues/4956 is resolved
                python-version: ['3.12', '3.13', '3.14']
                backend: ['x11', 'wayland']
                os: ['ubuntu-24.04']
                include:
                    - backend: macos
                      os: macos-latest
                      python-version: '3.12'
                    - backend: macos
                      os: macos-latest
                      python-version: '3.13'
        steps:
            - uses: actions/checkout@v6

            # Linux tests run in the same Docker image as local CI.
            - name: Build Docker image
              if: matrix.backend != 'macos'
              run: docker build -t qtile-ci .
            - name: Run Linux tests in container
              if: matrix.backend != 'macos'
              run: |
                mkdir coredumps
                sudo sysctl -w kernel.core_pattern=/workspace/coredumps/core-%e.%p.%t
                make ci-check
              env:
                QTILE_CI_PYTHON: ${{ matrix.python-version }}
                QTILE_CI_BACKEND: ${{ matrix.backend }}
                GITHUB_ACTIONS: true
                GITHUB_REF: ${{ github.ref }}
                GITHUB_SHA: ${{ github.sha }}
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                COVERALLS_FLAG_NAME: ${{ format('{0}-{1}', matrix.python-version, matrix.backend) }}
                COVERALLS_PARALLEL: true
                COVERALLS_SERVICE_JOB_ID: ${{ github.run_id }}
            - name: Run macOS unit tests for coverage
              if: matrix.backend != 'macos'
              run: |
                docker run --rm --init -i \
                  -v "$PWD:/workspace:z" \
                  -e USER_UID="$(id -u)" \
                  -e USER_GID="$(id -g)" \
                  -e HOME=/workspace \
                  --env-file <(env) \
                  qtile-ci bash -lc \
                  'uv run coverage run -a -m pytest test/backend/macos/test_unit_*.py --noconftest -q --tb=short &&
                   uv run coverage report -m &&
                   uv run coverage xml &&
                   uv tool run coveralls --service=github || true'

            # macOS tests run natively because the backend links AppKit.
            - name: Set up Python
              if: matrix.backend == 'macos'
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Set up uv
              if: matrix.backend == 'macos'
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"
                  python-version: ${{ matrix.python-version }}
            - name: Install macOS dependencies
              if: matrix.backend == 'macos'
              run: |
                uv pip install --system -e ".[dev]"
                uv pip install --system cffi setuptools
            - name: Build macOS native extension
              if: matrix.backend == 'macos'
              run: python libqtile/backend/macos/cffi/build.py
            - name: Run macOS unit tests
              if: matrix.backend == 'macos'
              run: python -m pytest test/backend/macos/test_unit_*.py -x -q --tb=short

    coverage:
        name: Finalize Coverage
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Coveralls Finished
              uses: coverallsapp/github-action@main
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                parallel-finished: true
